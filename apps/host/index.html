<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Wrapper</title>
    <meta charset="UTF-8" />
    <!-- Pinch-zoom desyncs the fixed header/bottom bar from the visual viewport in
         mobile Safari, leaving them stranded mid-content — this is an app shell,
         not zoomable text, so pinch is locked out entirely. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <meta name="description" content="One shell. Every module.">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="/favicon.ico" type="image/png" sizes="16x16">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
    <link rel="mask-icon" href="/favicon.svg" color="#B5ABFC">

    <!-- The app boots dark, so the status bar must too — otherwise the phone
         flashes white on every launch. -->
    <meta name="theme-color" content="#0F1119" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#F4F4F7" media="(prefers-color-scheme: light)">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <meta name="keywords" content="pwa" />

    <meta
      property="og:title"
      content="Wrapper"
      data-react-helmet="true"
    >
    <meta
      property="og:description"
      content="One shell. Every module."
      data-react-helmet="true"
    >
    <meta
      property="og:image"
      content="/cover.png"
      data-react-helmet="true"
    />
    <meta
      name="twitter:card"
      content="summary"
      data-react-helmet="true"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
